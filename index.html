<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>METRO TYPING: CHINA · Shanghai</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#17191c;--muted:#777b83;--line:#e4e6ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Arial,sans-serif}
.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.logo{font-size:24px;font-weight:950;letter-spacing:-1px}.logo span{font-size:11px;color:#777;letter-spacing:2px;display:block;margin-top:2px}
select,.input,button{font:inherit}.select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:white}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:10px 13px}.label{font-size:11px;color:var(--muted)}.value{font-size:22px;font-weight:900}
.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px}
.map{height:590px;position:relative;overflow:hidden;background:#fafafa;border-radius:14px}
.map svg{width:100%;height:100%}.route{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}.dot{stroke:#fff;stroke-width:2}.dot.current{r:8;stroke-width:3}.map-label{font-size:9px;fill:#50545b;paint-order:stroke;stroke:#fafafa;stroke-width:3px;stroke-linejoin:round}
.stationBox{text-align:center}.lineTitle{font-size:13px;color:#777;margin-bottom:7px}.station{font-size:44px;font-weight:950;letter-spacing:2px;min-height:60px}.chars{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:14px 0}.char{width:43px;height:50px;border-radius:9px;background:#eef0f2;display:grid;place-items:center;font-size:23px;font-weight:850}.char.done{background:#222;color:#fff}.char.current{outline:3px solid #222}.bar{height:7px;background:#eceef1;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#222;transition:.1s}.inputrow{display:flex;gap:8px;margin-top:14px}.input{width:100%;padding:14px;border:1px solid #d9dce1;border-radius:12px;font-size:18px;outline:none}.input:focus{border-color:#222;box-shadow:0 0 0 3px #0000000c}.modes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.modes button,.start{border:1px solid #ddd;background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}.modes button.active,.start{background:#222;color:#fff;border-color:#222}.help{font-size:12px;color:#777;margin-top:10px}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.legend span{font-size:11px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.finish{display:none;text-align:center}.finish .big{font-size:52px;font-weight:950}.finish button{margin-top:10px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.map{height:430px}.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:span 2}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">METRO TYPING: CHINA <span>SHANGHAI · 타자 연습</span></div>
    <select id="line" class="select"></select>
  </div>
  <div class="stats">
    <div class="stat"><div class="label">현재 타수</div><div class="value" id="tpm">0</div></div>
    <div class="stat"><div class="label">평균 타수</div><div class="value" id="avg">0</div></div>
    <div class="stat"><div class="label">정확도</div><div class="value" id="acc">100%</div></div>
    <div class="stat"><div class="label">콤보</div><div class="value" id="combo">0</div></div>
    <div class="stat"><div class="label">진행</div><div class="value" id="progressText">0 / 0</div></div>
  </div>

  <div class="layout">
    <div class="card">
      <div class="map" id="map"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <div id="game">
        <div class="stationBox">
          <div class="lineTitle" id="lineTitle">노선을 선택하세요</div>
          <div class="station" id="station">—</div>
          <div class="chars" id="chars"></div>
          <div class="bar"><i id="bar"></i></div>
          <div class="inputrow"><input id="input" class="input" disabled autocomplete="off" spellcheck="false"></div>
          <div class="modes">
            <button class="active" data-mode="zh">中文</button>
            <button data-mode="pinyin">拼音</button>
            <button data-mode="ko">한국어</button>
            <button data-mode="en">English</button>
          </div>
          <div class="help">时间不限 · 노선 완주형 타자 연습 · 기본 언어는 중국어</div>
          <button id="start" class="start">开始练习</button>
        </div>
      </div>
      <div id="finish" class="finish">
        <h2>练习完成!</h2>
        <div class="big" id="final">0</div>
        <div>평균 타수</div>
        <p id="info"></p>
        <button id="again" class="start">再来一次</button>
      </div>
    </div>
  </div>
</div>
<script>
let D, L, stations=[],idx=0,mode='zh',playing=false,startAt=0,total=0,correct=0,combo=0,best=0,errors=0,lastTypedAt=0;

const $=x=>document.getElementById(x);
fetch('metro-data.json').then(r=>r.json()).then(d=>{
 D=d; const s=$('line');
 d.lines.forEach((l,i)=>{let o=document.createElement('option');o.value=i;o.textContent=l.name;s.appendChild(o)});
 s.onchange=()=>{L=D.lines[s.value]; drawMap(); preview()};
 L=D.lines[0]; drawMap(); preview();
});

function preview(){$('lineTitle').textContent=L.name+' · '+L.stations.length+' stations';$('station').textContent='—';$('chars').innerHTML='';$('progressText').textContent='0 / '+L.stations.length}
function norm(s){return s.trim().toLowerCase().normalize('NFKC').replace(/[\\s·'’.\-]/g,'')}
function target(){let s=stations[idx];return (s && s[mode]) || (s?s.zh:'')}
function render(){
 let s=stations[idx],t=target();
 $('lineTitle').textContent=L.name+' · '+(idx+1)+' / '+stations.length+(s.transfer?' · 换乘站':'');
 $('station').textContent=s.zh;$('progressText').textContent=idx+' / '+stations.length;
 $('chars').innerHTML='';
 [...t].forEach((c,i)=>{let e=document.createElement('div');e.className='char';e.textContent=c;e.dataset.i=i;$('chars').appendChild(e)});
 $('input').value='';$('input').placeholder=mode==='zh'?'输入中文站名...':mode==='pinyin'?'输入拼音...':mode==='ko'?'한국어 역명...':'English station name...';
 $('bar').style.width='0%';drawMap();
}
function drawMap(){
 if(!L)return;
 let all=L.coords||[], pts=[];
 if(Array.isArray(all)) for(let p of all){if(Array.isArray(p)&&p.length>=2)pts.push(p)}
 // If route polyline isn't usable, fall back to station coordinates.
 if(pts.length<2) pts=L.stations.map(s=>s.coord).filter(p=>Array.isArray(p)&&p.length>=2);
 let W=900,H=560,pad=35;
 let xs=pts.map(p=>+p[0]),ys=pts.map(p=>+p[1]);
 if(!xs.length){$('map').innerHTML='<div style="padding:30px;color:#777">이 노선의 좌표 데이터가 없습니다.</div>';return}
 let minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
 const X=x=>pad+(x-minx)/Math.max(1,maxx-minx)*(W-2*pad);
 const Y=y=>H-pad-(y-miny)/Math.max(1,maxy-miny)*(H-2*pad);
 let color=L.color||'#555';
 let poly=pts.map(p=>X(+p[0])+','+Y(+p[1])).join(' ');
 let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline class="route" style="stroke:${color}" points="${poly}"/>`;
 L.stations.forEach((s,i)=>{
   let p=s.coord;if(!Array.isArray(p)||p.length<2)return;
   let active=playing && i===idx;
   svg+=`<circle class="dot ${active?'current':''}" cx="${X(+p[0])}" cy="${Y(+p[1])}" r="${active?8:5}" fill="${color}"/>`;
   if(i%Math.ceil(L.stations.length/35)===0 || active) svg+=`<text class="map-label" x="${X(+p[0])+7}" y="${Y(+p[1])-7}">${s.zh}</text>`;
 });
 svg+='</svg>';$('map').innerHTML=svg;
 $('legend').innerHTML=`<span><i style="background:${color}"></i>${L.name}</span><span>● ${L.stations.length}개 역</span>`;
}
function stats(){
 if(!playing)return;
 let mins=Math.max((performance.now()-startAt)/60000,1/60000);
 $('tpm').textContent=Math.round(total/mins);
 $('avg').textContent=Math.round(correct/mins);
 $('acc').textContent=(total?Math.round(correct/total*100):100)+'%';
 $('combo').textContent=combo;
 requestAnimationFrame(stats);
}
$('input').addEventListener('input',()=>{
 if(!playing)return;
 total++;
 let typed=norm($('input').value),tar=norm(target()),ok=true;
 for(let i=0;i<typed.length;i++)if(typed[i]!==tar[i]){ok=false;break}
 if(ok){correct++;combo++;best=Math.max(best,combo)}else{combo=0;errors++}
 let n=0;while(n<typed.length&&n<tar.length&&typed[n]===tar[n])n++;
 [...$('chars').children].forEach((e,i)=>{e.classList.toggle('done',i<n);e.classList.toggle('current',i===n)});
 $('bar').style.width=(tar.length?Math.min(100,n/tar.length*100):0)+'%';
 if(typed===tar&&tar.length){idx++;if(idx>=stations.length){finish();return}render()}
});
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;if(playing)render()
});
$('start').onclick=()=>{
 L=D.lines[$('line').value];stations=[...L.stations];idx=0;playing=true;startAt=performance.now();total=0;correct=0;combo=0;best=0;errors=0;
 $('input').disabled=false;$('finish').style.display='none';$('game').style.display='block';render();$('input').focus();stats();
};
$('again').onclick=()=>$('start').click();
function finish(){
 playing=false;$('input').disabled=true;
 let mins=Math.max((performance.now()-startAt)/60000,1/60000),avg=Math.round(correct/mins),acc=total?Math.round(correct/total*100):100;
 $('final').textContent=avg+' 타';$('info').textContent=`정확도 ${acc}% · 최고 콤보 ${best} · ${stations.length}개 역 완주`;
 $('game').style.display='none';$('finish').style.display='block';drawMap();
}
</script>
</body></html>
